# ============================================
# CONFIGURACIÓN DEL PROYECTO DQN CUDA
# ============================================

[network]
# IP y puerto del Jetson Xavier
jetson_ip = 172.22.234.49
jetson_user = jetson
training_port = 5556
inference_port = 5557

[environment]
# Dimensiones del entorno (más pequeño para mejor aprendizaje)
width = 400
height = 400
grid_size = 20

# Obstáculos (menos obstáculos para facilitar aprendizaje)
num_obstacles = 5

# Límites de episodio
max_steps = 200

[training]
# Número de episodios para entrenamiento
episodes = 200

# Intervalo de guardado del modelo
save_interval = 50

# Epsilon (exploración)
epsilon_start = 1.0
epsilon_end = 0.01
epsilon_decay = 0.995

[neural_network]
# Arquitectura de la red
state_size = 15
action_size = 8
hidden_size_1 = 128
hidden_size_2 = 128
hidden_size_3 = 64

# Hiperparámetros
learning_rate = 0.0001
gamma = 0.99
batch_size = 64
buffer_size = 100000

[inference]
# Episodios para evaluación
episodes = 10

# Delay entre pasos (segundos) para visualización
delay = 0.05

[paths]
# Directorio en el Jetson
jetson_dir = ~/dqn_cuda_project

# Directorio de modelos
models_dir = models

# Modelo por defecto para inferencia
default_model = dqn_model_final.bin
